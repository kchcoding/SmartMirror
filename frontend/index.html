<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smart Mirror</title>
  <link rel="stylesheet" href="/css/mirror.css">
</head>
<body>
  <div id="alerts" aria-live="polite"></div>

  <main class="grid">
    <section id="clock">
      <div id="time">--:--</div>
      <div id="date"></div>
    </section>

    <section id="weather" class="widget"></section>

    <section id="stage" class="widget">
      <div id="tryon" hidden></div>
      <div id="outfit"></div>
    </section>

    <section id="agenda" class="widget"></section>
    <section id="indoor" class="widget"></section>
  </main>

  <footer id="briefing"></footer>
  <div id="link-status" title="서버 연결 상태"></div>

  <script src="/js/mirror.js"></script>
</body>
</html>
